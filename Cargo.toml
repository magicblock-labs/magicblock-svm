[workspace]
members = ["loader-v4-program", "program-runtime", "solana-account", "svm", "transaction-context"]
resolver = "2"

[workspace.package]
authors = ["Anza Maintainers <maintainers@anza.xyz>"]
edition = "2024"
homepage = "https://anza.xyz/"
license = "Apache-2.0"
repository = "https://github.com/anza-xyz/agave"
version = "4.2.2"

[workspace.dependencies]
solana-svm = { path = "svm", features = ["agave-unstable-api"] }
spl-token-interface = "3.0.0"
agave-feature-set = { version = "=4.2.2", features = ["agave-unstable-api"] }
agave-precompiles = { version = "=4.2.2", features = ["agave-unstable-api"] }
protosol = "=9.0.1"
solana-poseidon = "4.0.0"
solana-vote-program = { version = "=4.2.2", default-features = false, features = ["agave-unstable-api"] }
solana-zk-elgamal-proof-program = { version = "=4.2.2", features = ["agave-unstable-api"] }
xxhash-rust = "0.8.5"
wincode = { version = "0.5.5", features = ["derive"] }
agave-logger = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-syscalls = { version = "=4.2.2", default-features = false, features = ["agave-unstable-api"] }
ahash = "0.8.12"
assert_matches = "1.5.0"
base64 = "0.22.1"
bincode = "1.3.3"
cfg-if = "1.0.4"
ed25519-dalek = "=1.0.1"
env_logger = "0.11.9"
itertools = "0.12.1"
libsecp256k1 = { version = "0.6.0", default-features = false, features = ["static-context", "std"] }
log = "0.4.29"
openssl = "0.10"
percentage = "0.1.0"
qualifier_attr = { version = "0.2.2", default-features = false }
rand = "0.9.2"
rand0-7 = { package = "rand", version = "0.7" }
serde = { version = "1.0.228", features = ["rc"] }
serde_bytes = { version = "0.11" }
shuttle = "0.7.1"
solana-account = { path = "solana-account", version = ">=4.3.1,<4.4.0" }
solana-account-info = "3.1.1"
solana-bincode = "3.1.0"
solana-bpf-loader-program = { version = "=4.2.2", default-features = false, features = [
    "agave-unstable-api"
] }
solana-clock = ">=3.0.1,<3.2.0"
solana-compute-budget = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-compute-budget-interface = "3.0.0"
solana-compute-budget-program = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-ed25519-program = "3.0.0"
solana-epoch-rewards = ">=3.1.0,<3.2.0"
solana-epoch-schedule = ">=3.2.0,<3.3.0"
solana-fee-calculator = ">=3.2.2,<3.3.0"
solana-fee-structure = "3.0.0"
solana-frozen-abi = ">=3.7.0,<3.8.0"
solana-frozen-abi-macro = "3.6.0"
solana-hash = ">=4.4.0,<4.6.0"
solana-instruction = ">=3.4.0,<3.5.0"
solana-instruction-error = ">=2.4.0,<2.5.0"
solana-instructions-sysvar = "4.0.0"
solana-keypair = "3.1.2"
solana-last-restart-slot = ">=3.0.1,<3.2.0"
solana-loader-v3-interface = "7.0.0"
solana-loader-v4-interface = "3.1.0"
solana-loader-v4-program = { path = "loader-v4-program", features = ["agave-unstable-api"] }
solana-message = ">=4.2.3,<4.5.0"
solana-native-token = "3.0.0"
solana-nonce = ">=3.2.0,<3.3.0"
solana-nonce-account = ">=4.1.0,<4.2.0"
solana-packet = ">=4.1.0,<4.3.0"
solana-precompile-error = "3.0.0"
solana-program-binaries = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-program-entrypoint = "3.1.1"
solana-program-pack = "3.1.0"
solana-program-runtime = { path = "program-runtime", features = ["agave-unstable-api"] }
solana-pubkey = { version = ">=4.2.0,<4.3.0", default-features = false }
solana-rent = ">=4.2.1,<4.4.0"
solana-sbpf = { version = "=0.21.1", default-features = false }
solana-sdk-ids = "3.1.0"
solana-secp256k1-program = { version = "3.0.1", features = ["bincode"] }
solana-secp256r1-program = { version = "3.0.0", features = ["openssl-vendored"] }
solana-signature = { version = ">=3.4.1,<3.5.0", default-features = false }
solana-signer = "3.0.1"
solana-slot-hashes = ">=3.1.0,<3.2.0"
solana-stable-layout = "3.0.1"
solana-stake-interface = ">=4.3.0,<4.3.1"
solana-svm-callback = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-svm-feature-set = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-svm-log-collector = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-svm-measure = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-svm-timings = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-svm-transaction = ">=4.2.0,<4.3.0"
solana-svm-type-overrides = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-system-interface = { version = ">=3.2.0,<3.3.0", features = ["alloc", "bincode", "serde"] }
solana-system-program = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-system-transaction = ">=4.0.0,<4.1.0"
solana-sysvar = ">=4.0.0,<4.2.0"
solana-sysvar-id = "3.1.0"
solana-transaction = ">=4.1.4,<4.2.0"
solana-transaction-context = { path = "transaction-context", features = ["agave-unstable-api"] }
solana-transaction-error = ">=3.3.1,<3.4.0"
spl-generic-token = "2.0"
static_assertions = "1.1.0"
test-case = "3.3"
thiserror = "2.0"

[workspace.lints.rust.unexpected_cfgs]
check-cfg = [
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
    'cfg(target_arch, values("sbf"))',
    'cfg(target_os, values("solana"))'
]
level = "warn"
priority = 0

[patch.crates-io]
solana-account = { path = "solana-account" }
solana-program-runtime = { path = "program-runtime" }
solana-transaction-context = { path = "transaction-context" }
